name: Bug report
description: Report something that isn't working as expected with the wheel sensor, firmware, or physical build.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in as much
        detail as you can - it makes this much faster to track down.

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Where does the problem show up?
      options:
        - ESPHome firmware (hamster-wheel-sensor.yaml)
        - Wiring / sensor (ESP board, TCRT5000, ...)
        - 3D-printed enclosure / mounting
        - PCB / schematic
        - Build instructions / documentation
        - Home Assistant integration or dashboard cards (wrong repo, but fine to report here too)
        - Something else
    validations:
      required: true

  - type: input
    id: esphome-version
    attributes:
      label: ESPHome version
      placeholder: e.g. 2026.7.0
    validations:
      required: false

  - type: input
    id: board
    attributes:
      label: Board / sensor used
      placeholder: e.g. ESP8266 D1 Mini + TCRT5000
    validations:
      required: false

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error messages
      description: ESPHome device logs, if any. This gets formatted as code automatically.
      render: shell
    validations:
      required: false
