<svg viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Verkabelung D1 Mini mit TCRT5000: 3V3 zu VCC, GND zu GND, D2/GPIO4 zu D0/OUT. Der TCRT5000 erkennt optisch eine Markierung auf dem Laufrad, einmal pro Umdrehung.">
  <rect x="1" y="1" width="678" height="398" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>

  <text x="28" y="36" font-family="-apple-system,Segoe UI,sans-serif" font-size="16" font-weight="600" fill="#1f2328">Bastler-Einstieg: Verkabelung D1 Mini ↔ TCRT5000</text>
  <text x="28" y="56" font-family="-apple-system,Segoe UI,sans-serif" font-size="12" fill="#57606a">3 Drähte, kein Löten nötig</text>

  <!-- D1 Mini box -->
  <rect x="40" y="90" width="170" height="150" rx="10" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/>
  <text x="125" y="158" font-family="-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">D1 Mini</text>
  <text x="125" y="176" font-family="-apple-system,Segoe UI,sans-serif" font-size="11" fill="#57606a" text-anchor="middle">(ESP8266)</text>

  <!-- TCRT5000 box -->
  <rect x="470" y="90" width="170" height="150" rx="10" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/>
  <text x="555" y="158" font-family="-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">TCRT5000</text>
  <text x="555" y="176" font-family="-apple-system,Segoe UI,sans-serif" font-size="11" fill="#57606a" text-anchor="middle">IR-Sensor-Modul</text>

  <defs>
    <marker id="arrowRight" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/>
    </marker>
    <marker id="arrowLeftAccent" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M10,0 L0,5 L10,10 z" fill="#0969da"/>
    </marker>
  </defs>

  <!-- Power row -->
  <line x1="212" y1="130" x2="468" y2="130" stroke="#1f2328" stroke-width="1.5" marker-end="url(#arrowRight)"/>
  <text x="216" y="122" font-family="-apple-system,Segoe UI,sans-serif" font-size="11" fill="#1f2328">3V3</text>
  <text x="464" y="122" font-family="-apple-system,Segoe UI,sans-serif" font-size="11" fill="#1f2328" text-anchor="end">VCC</text>
  <text x="340" y="118" font-family="-apple-system,Segoe UI,sans-serif" font-size="11" fill="#57606a" text-anchor="middle">3.3 V</text>

  <!-- GND row -->
  <line x1="212" y1="165" x2="468" y2="165" stroke="#57606a" stroke-width="1.5"/>
  <text x="216" y="157" font-family="-apple-system,Segoe UI,sans-serif" font-size="11" fill="#57606a">GND</text>
  <text x="464" y="157" font-family="-apple-system,Segoe UI,sans-serif" font-size="11" fill="#57606a" text-anchor="end">GND</text>

  <!-- Signal row (accent = the interesting one) -->
  <line x1="212" y1="202" x2="468" y2="202" stroke="#0969da" stroke-width="2.5" marker-start="url(#arrowLeftAccent)"/>
  <text x="216" y="194" font-family="-apple-system,Segoe UI,sans-serif" font-size="11" fill="#0969da" font-weight="600">D2 / GPIO4</text>
  <text x="464" y="194" font-family="-apple-system,Segoe UI,sans-serif" font-size="11" fill="#0969da" font-weight="600" text-anchor="end">D0 / OUT</text>
  <text x="340" y="219" font-family="-apple-system,Segoe UI,sans-serif" font-size="11.5" fill="#0969da" font-weight="600" text-anchor="middle">Signal · 1 Puls pro Umdrehung</text>

  <!-- Wheel detection inset -->
  <line x1="555" y1="240" x2="555" y2="270" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="555" cy="325" r="45" fill="none" stroke="#57606a" stroke-width="1.5"/>
  <line x1="555" y1="280" x2="555" y2="292" stroke="#0969da" stroke-width="3.5" stroke-linecap="round"/>
  <text x="555" y="386" font-family="-apple-system,Segoe UI,sans-serif" font-size="11" fill="#57606a" text-anchor="middle">Laufrad mit 1 Markierung</text>
  <text x="470" y="255" font-family="-apple-system,Segoe UI,sans-serif" font-size="10.5" fill="#57606a" text-anchor="start">TCRT5000 erkennt die Markierung optisch</text>

  <!-- Footnote -->
  <text x="28" y="384" font-family="-apple-system,Segoe UI,sans-serif" font-size="10" fill="#8b949e">Pin-Namen wie auf den Boards aufgedruckt · esphome/hamster-wheel-sensor.yaml erwartet das Signal auf GPIO4</text>
</svg>
